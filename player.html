<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jonli efir</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, sans-serif;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ccc; text-align: center; padding: 16px; font-size: 15px;
  }
</style>
</head>
<body>
  <video id="v" controls autoplay playsinline></video>
  <div id="msg"></div>

<script>
  try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}

  const params = new URLSearchParams(window.location.search);
  const src = params.get("src");
  const video = document.getElementById("v");
  const msg = document.getElementById("msg");

  function showError(text) {
    video.style.display = "none";
    msg.textContent = text;
  }

  if (!src) {
    showError("Kanal manzili topilmadi.");
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari/iOS - HLS'ni tabiiy qo'llab-quvvatlaydi
    video.src = src;
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data.fatal) {
        showError("Oqimni yuklab bo'lmadi. Manba mavjud emas yoki CORS bloklangan.");
      }
    });
  } else {
    showError("Bu qurilma/brauzer jonli oqimni qo'llab-quvvatlamaydi.");
  }
</script>
</body>
</html>
